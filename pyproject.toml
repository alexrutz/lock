[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lock"
version = "0.1.0"
description = "Single-user encrypted photo vault with TOTP-protected access."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "pyotp>=2.9",
    "qrcode[pil]>=7.4",
    "itsdangerous>=2.1",
    "Pillow>=10.2",
]

[tool.setuptools.packages.find]
include = ["app*"]
